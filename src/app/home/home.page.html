<ion-header [translucent]="true">
  <ion-toolbar color="danger">
    <ion-title class="ion-text-center">Pokédex TCG</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/favorites" class="header-fav-btn" title="Ir para os favoritos" aria-label="Ir para os favoritos">
        <ion-icon name="heart" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar color="danger">
    <div class="search-container">
      <ion-searchbar 
        [(ngModel)]="searchTerm" 
        (ionSearch)="onSearchSubmit()"
        (ionClear)="onSearchClear()"
        placeholder="Digite o nome ou ID..." 
        animated="true">
      </ion-searchbar>
      <ion-button fill="solid" color="light" class="search-btn" (click)="onSearchSubmit()">
        Buscar
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="tcg-bg ion-padding">

  <!-- Spinner durante busca na API -->
  <div *ngIf="isLoadingSearch" class="ion-text-center ion-padding">
    <ion-spinner name="crescent" color="light"></ion-spinner>
    <p style="color: #fff;">Buscando na PokéAPI...</p>
  </div>

  <!-- Mensagem caso não encontre nada -->
  <div *ngIf="!isLoadingSearch && isSearching && filteredPokemons.length === 0" class="ion-text-center ion-padding">
    <p style="color: #fff; font-weight: bold;">Nenhum Pokémon encontrado para "{{ searchTerm }}"</p>
    <ion-button fill="outline" color="light" size="small" (click)="onSearchClear()">Limpar busca</ion-button>
  </div>

  <ion-grid *ngIf="!isLoadingSearch">
    <ion-row>
      <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let pokemon of filteredPokemons; trackBy: trackByPokemonId">
        
        <div class="tcg-card" [routerLink]="['/pokemon', pokemon.id]">
          
          <div class="card-header-tcg">
            <span class="card-name">{{ pokemon.name | uppercase }}</span>
            <span class="card-hp"><small>HP</small> {{ (pokemon.id || 0) * 10 }}</span>
          </div>

          <div class="card-image-box">
            <img 
              [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + pokemon.id + '.png'" 
              [alt]="pokemon.name" 
              loading="lazy"
            />
          </div>

          <div class="card-info-bar">
            <span>NO. {{ (pokemon.id || 0) | number:'3.0-0' }}</span>
          </div>

          <div class="card-body-tcg">
            <div class="attack-row">
              <span class="energy-icon">★</span>
              <span class="attack-name">Acessar Pokédex</span>
              <span class="attack-damage">30</span>
            </div>
          </div>

          <div class="card-footer-tcg">
            <span>ilus. PokeAPI</span>
            <button 
              type="button" 
              class="fav-btn" 
              [class.is-favorite]="isFavorite(pokemon.id)"
              (click)="toggleFavorite($event, pokemon)"
              title="Favoritar">
              <ion-icon [name]="isFavorite(pokemon.id) ? 'heart' : 'heart-outline'"></ion-icon>
            </button>
          </div>

        </div>

      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-infinite-scroll *ngIf="!isSearching" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Carregando mais cartas...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
