<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Pokédex</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/favorites">
        <ion-icon slot="icon-only" name="heart" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-searchbar 
      placeholder="Pesquisar Pokémon..." 
      (ionInput)="onSearch($event)"
      [debounce]="250"
      animated>
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let pokemon of filteredPokemons">
        <ion-card [routerLink]="['/pokemon', pokemon.id]" button>
          <div class="image-container">
            <img [src]="pokemon.imageUrl" [alt]="pokemon.name" loading="lazy" />
          </div>
          <ion-card-header>
            <div class="card-header-content">
              <ion-card-title>#{{ pokemon.id }} {{ pokemon.name | titlecase }}</ion-card-title>
              <ion-button fill="clear" size="small" (click)="toggleFavorite($event, pokemon.id)">
                <ion-icon 
                  [name]="isPokemonFavorite(pokemon.id) ? 'star' : 'star-outline'" 
                  [color]="isPokemonFavorite(pokemon.id) ? 'warning' : 'medium'">
                </ion-icon>
              </ion-button>
            </div>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-infinite-scroll *ngIf="!searchTerm" (ionInfinite)="loadPokemons($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Carregando mais Pokémons...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
