<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>🐾 PokéApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <!-- Loading Inicial -->
  <div *ngIf="isLoading && pokemons.length === 0" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Carregando Pokédex...</p>
  </div>

  <!-- Grid Responsivo -->
  <ion-grid *ngIf="pokemons.length > 0">
    <ion-row>
      <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let pokemon of pokemons">
        
        <ion-card [routerLink]="['/pokemon', pokemon.id]" class="pokemon-card">
          <div class="card-header-actions">
            <ion-button fill="clear" (click)="toggleFavorite($event, pokemon.id)">
              <ion-icon 
                [name]="favoritesService.isFavorite(pokemon.id!) ? 'star' : 'star-outline'"
                [color]="favoritesService.isFavorite(pokemon.id!) ? 'warning' : 'medium'">
              </ion-icon>
            </ion-button>
          </div>

          <img [src]="pokemon.imageUrl" [alt]="pokemon.name" class="pokemon-image" />

          <ion-card-header>
            <ion-card-title class="ion-text-center">
              #{{ pokemon.id }} {{ pokemon.name | titlecase }}
            </ion-card-title>
          </ion-card-header>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Paginação Infinita -->
  <ion-infinite-scroll (ionInfinite)="loadPokemons($event)">
    <ion-infinite-scroll-content 
      loadingSpinner="bubbles" 
      loadingText="Carregando mais Pokémons...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
